name: Browser handoff tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked browser-test dependency without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install synthetic-media test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Require native media tools (do not silently skip e2e tests)
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Unit protocol tests
        run: npm test
      - name: Synthetic Chromium and real WASM integration
        run: npm run test:e2e
